name: Build the Card site and publish Cards to Bluesky

# One run: build the site, deploy it to GitHub Pages, then publish pending Cards,
# so a Card's page is live before its post links to it. Receipts
# (cards/*/bluesky.json) are pushed with GITHUB_TOKEN, which triggers no
# workflow; the next scheduled run rebuilds the site with them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "cards/*/bluesky.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bluesky-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The latest main, not the triggering commit: runs are serialized, and an
      # earlier run may have pushed receipts (and new Cards) since this one was queued.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The latest main, not the triggering commit: runs are serialized, and an
      # earlier run may have pushed receipts (and new Cards) since this one was queued.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Configure the receipt committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish pending Cards
        env:
          BLUESKY_AGENT_IDENTIFIER: ${{ vars.BLUESKY_AGENT_IDENTIFIER }}
          BLUESKY_AGENT_APP_PASSWORD: ${{ secrets.BLUESKY_AGENT_APP_PASSWORD }}
          BLUESKY_OPERATOR_IDENTIFIER: ${{ vars.BLUESKY_OPERATOR_IDENTIFIER }}
          BLUESKY_OPERATOR_APP_PASSWORD: ${{ secrets.BLUESKY_OPERATOR_APP_PASSWORD }}
          BLUESKY_SERVICE_URL: ${{ vars.BLUESKY_SERVICE_URL }}
        run: node scripts/publish.mjs
